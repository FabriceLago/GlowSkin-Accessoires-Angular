<section class="border-b border-dore/20 bg-sauge-light/15 py-14 text-center">
  <p class="eyebrow">Besoin d'aide ?</p>
  <h1 class="mt-3 font-serif text-4xl text-brun sm:text-5xl">Questions fréquentes</h1>
</section>

<div class="container-editorial max-w-3xl py-16">
  @for (category of categories(); track category) {
    <div class="mb-10">
      <h2 class="font-serif text-xl text-terracotta">{{ category }}</h2>
      <div class="mt-4 divide-y divide-dore/15 border-t border-dore/15">
        @for (item of itemsByCategory(category); track item.id) {
          <div>
            <button
              type="button"
              (click)="toggle(item.id)"
              class="flex w-full items-center justify-between gap-4 py-5 text-left"
              [attr.aria-expanded]="openId() === item.id"
            >
              <span class="font-serif text-lg text-brun">{{ item.question }}</span>
              <svg
                width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#C9A24D" stroke-width="2"
                class="shrink-0 transition-transform duration-300"
                [class.rotate-45]="openId() === item.id"
              ><path d="M12 5v14M5 12h14" /></svg>
            </button>
            @if (openId() === item.id) {
              <p class="pb-5 text-sm leading-relaxed text-brun/70">{{ item.answer }}</p>
            }
          </div>
        }
      </div>
    </div>
  }
</div>
