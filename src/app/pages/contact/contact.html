<section class="border-b border-dore/20 bg-sauge-light/15 py-14 text-center">
  <p class="eyebrow">Nous écrire</p>
  <h1 class="mt-3 font-serif text-4xl text-brun sm:text-5xl">Contact</h1>
  <p class="mx-auto mt-3 max-w-md text-sm text-brun/60">Une question ? Notre équipe répond sous 48h ouvrées.</p>
</section>

<div class="container-editorial grid max-w-4xl gap-12 py-16 sm:grid-cols-[1fr_1.3fr]">
  <div class="space-y-6 text-sm text-brun/70">
    <div>
      <h2 class="font-serif text-lg text-brun">E-mail</h2>
      <p class="mt-1">bonjour&#64;glowskin-accessoires.fr</p>
    </div>
    <div>
      <h2 class="font-serif text-lg text-brun">Téléphone</h2>
      <p class="mt-1">+33 1 84 60 12 45 (lun-ven, 9h-18h)</p>
    </div>
    <div>
      <h2 class="font-serif text-lg text-brun">Atelier</h2>
      <p class="mt-1">14 rue des Tanneurs, 75003 Paris</p>
    </div>
  </div>

  <div>
    @if (isSubmitted()) {
      <div class="rounded-xl2 border border-sauge/40 bg-sauge-light/20 p-8 text-center">
        <p class="font-serif text-xl text-brun">Message envoyé</p>
        <p class="mt-2 text-sm text-brun/60">Merci, nous vous répondrons très vite.</p>
      </div>
    } @else {
      <form (submit)="onSubmit($event)" class="space-y-4">
        <label class="block text-sm">
          <span class="text-brun/70">Nom complet</span>
          <input type="text" required class="mt-1 w-full rounded-lg border border-brun/15 px-4 py-2.5 focus:border-dore focus:outline-none" [ngModel]="form().name" name="name" (ngModelChange)="update('name', $event)" />
        </label>
        <label class="block text-sm">
          <span class="text-brun/70">E-mail</span>
          <input type="email" required class="mt-1 w-full rounded-lg border border-brun/15 px-4 py-2.5 focus:border-dore focus:outline-none" [ngModel]="form().email" name="email" (ngModelChange)="update('email', $event)" />
        </label>
        <label class="block text-sm">
          <span class="text-brun/70">Sujet</span>
          <select class="mt-1 w-full rounded-lg border border-brun/15 px-4 py-2.5 focus:border-dore focus:outline-none" [ngModel]="form().subject" name="subject" (ngModelChange)="update('subject', $event)">
            <option value="">Choisir un sujet</option>
            <option value="commande">Une commande</option>
            <option value="produit">Un produit</option>
            <option value="presse">Presse &amp; partenariats</option>
            <option value="autre">Autre</option>
          </select>
        </label>
        <label class="block text-sm">
          <span class="text-brun/70">Message</span>
          <textarea required rows="5" class="mt-1 w-full rounded-lg border border-brun/15 px-4 py-2.5 focus:border-dore focus:outline-none" [ngModel]="form().message" name="message" (ngModelChange)="update('message', $event)"></textarea>
        </label>
        <button type="submit" class="btn-primary w-full">Envoyer le message</button>
      </form>
    }
  </div>
</div>
