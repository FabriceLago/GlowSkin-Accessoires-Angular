<section class="border-b border-dore/20 bg-sauge-light/15 py-14 text-center">
  <p class="eyebrow">Journal</p>
  <h1 class="mt-3 font-serif text-4xl text-brun sm:text-5xl">Le carnet de rituels</h1>
  <p class="mx-auto mt-3 max-w-md text-sm text-brun/60">Guides, conseils et réflexions pour prendre soin de sa peau, un geste à la fois.</p>
</section>

<div class="container-editorial py-16">
  <div class="grid gap-10 sm:grid-cols-2 lg:grid-cols-3">
    @for (article of articles; track article.id) {
      <a [routerLink]="['/journal', article.slug]" class="group block" appFadeUp>
        <div class="aspect-[4/3] overflow-hidden rounded-xl2 bg-sauge-light/20">
          <img [src]="article.image.url" [alt]="article.image.alt" class="h-full w-full object-cover transition-transform duration-500 ease-out-smooth group-hover:scale-105" />
        </div>
        <p class="mt-4 text-xs uppercase tracking-wider text-terracotta">{{ article.category }} · {{ article.readingTime }} min</p>
        <h2 class="mt-2 font-serif text-xl text-brun">{{ article.title }}</h2>
        <p class="mt-2 text-sm leading-relaxed text-brun/60">{{ article.excerpt }}</p>
      </a>
    }
  </div>
</div>
